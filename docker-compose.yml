name: balancetrail

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-balancetrail}
      POSTGRES_USER: ${POSTGRES_USER:-balancetrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-balancetrail-local-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-balancetrail}
      DB_USERNAME: ${POSTGRES_USER:-balancetrail}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-balancetrail-local-password}
      APP_USERNAME: ${APP_USERNAME:-analyst}
      APP_PASSWORD: ${APP_PASSWORD:-change-me-now}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      UPLOAD_DIRECTORY: /app/data/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-25MB}
      BATCH_CHUNK_SIZE: ${BATCH_CHUNK_SIZE:-100}
      BATCH_RETRY_LIMIT: ${BATCH_RETRY_LIMIT:-3}
      BATCH_SKIP_LIMIT: ${BATCH_SKIP_LIMIT:-1000000}
      BATCH_RETRY_INITIAL_MS: ${BATCH_RETRY_INITIAL_MS:-100}
      BATCH_RETRY_MAX_MS: ${BATCH_RETRY_MAX_MS:-1000}
      BATCH_WORKER_THREADS: ${BATCH_WORKER_THREADS:-2}
      BATCH_QUEUE_CAPACITY: ${BATCH_QUEUE_CAPACITY:-20}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
    ports:
      - "8080:8080"
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  upload_data:
