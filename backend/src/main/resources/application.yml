spring:
  application:
    name: balancetrail
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/balancetrail}
    username: ${DB_USERNAME:balancetrail}
    password: ${DB_PASSWORD:balancetrail}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    enabled: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  storage:
    upload-directory: ${UPLOAD_DIRECTORY:./data/uploads}
  bootstrap-user:
    username: ${APP_USERNAME:analyst}
    password: ${APP_PASSWORD:change-me-now}
  batch:
    chunk-size: 100
